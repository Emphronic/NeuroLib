# cargo-deny configuration for NeuroLib (Kostyanikov / Emphronic).
# Run: cargo deny check
# Put this file in the repository root, next to the workspace Cargo.toml.

[graph]
# Check every platform the lockfile covers, not only the host.
all-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
    # zip 0.6.6 / zstd 0.11 / zstd-safe 5.0.2: only via burn-tch -> tch (optional libtorch
    # backend, not built). Remove these if the `tch` backend is ever enabled.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0548",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0395",
    "RUSTSEC-2026-0397",
    "RUSTSEC-2026-0399",
    "RUSTSEC-2026-0400",
    "RUSTSEC-2026-0401",
    "RUSTSEC-2026-0402",
    "RUSTSEC-2026-0404",
    "RUSTSEC-2026-0406",
    # lru 0.16.4: pulled by zarrs 0.23.14 (latest). Revisit when zarrs moves to lru >= 0.18.2.
    "RUSTSEC-2026-0253",
    # Unmaintained, no fixed upgrade available. Revisit periodically.
    "RUSTSEC-2026-0543", # chrono
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0134", # rustls-pemfile
    "RUSTSEC-2026-0206", # rustybuzz
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0372", # zvariant_derive
]

[licenses]
version = 2
# Permissive licenses only. If `cargo deny check licenses` reports another one for a crate
# you accept, add it here (or add a [[licenses.exceptions]] entry for that one crate).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common with Burn/GUI stacks; report them, do not fail.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

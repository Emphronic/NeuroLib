[package]
name = "neo-synapse"
description = "Spike-train metrics and sorting-file loading for curation: correlograms, ISI, firing rate, snippets, PCA"
version.workspace = true
edition = "2024"
authors = ["Kostyanikov"]
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = true

[dependencies]
neo-core = { version = "0.1.0", path = "../neo-core" }
neo-io = { version = "0.1.0", path = "../neo-io", default-features = false, features = ["neuro"] }
serde = { version = "1.0.229", features = ["derive"] }

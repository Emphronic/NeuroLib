[package]
name = "neo-store"
description = "syn format - storage of NeuroLib weights: binary container with a network graph (analogous to NIR), checksums, mmap reading, quantized and sparse tensors, sharding"
version.workspace = true
edition = "2024"
authors = ["Kostyanikov"]
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = true

[features]
default = ["mmap"]
# Reading via file-to-memory mapping (zero copy). The only `unsafe` of the crate.
mmap = ["dep:memmap2"]
# Unpacking block formats GGUF (Store::read_dequantized_f32) via neo-quantization.
# It draws burn, so it is disabled by default: without it, the crate depends only on std.
quantization = ["dep:neo-quantization"]

[dependencies]
memmap2 = { version = "0.9.11", optional = true }
neo-quantization = { version = "0.1.0", path = "../neo-quantization", optional = true }

[dev-dependencies]
# Checking that the export to NIR JSON is valid JSON.
serde_json = "1.0.151"

[[bin]]
name = "synctl"
path = "src/bin/synctl.rs"





